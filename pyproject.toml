[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "elegant-toolkit"
version = "0.1.1"
description = "C.elegans bioimage analysis Toolkit (under active development)"
readme = "README.md"
authors = [{name = "Angelo Luiz Angonezi", email = "angeloangonezi2@gmail.com"}]
requires-python = ">=3.10"
keywords = ["python", "toolkit", "image analysis", "microscopy"]

[project.urls]
Homepage = "https://github.com/angelo-angonezi/elegant-toolkit"
Issues = "https://github.com/angelo-angonezi/elegant-toolkit/issues"

[tool.setuptools.packages.find]
where = ["src"]

dependencies = [
    # imaging / microscopy IO
    # pycudadecon is deliberately *not* listed here: its PyPI wheel doesn't ship a working
    # compiled cudaDecon backend and doesn't install properly on hpc - install it via
    # conda-forge instead, with "cet-download_pycudadecon" (see cet.setup.download_pycudadecon),
    # same pattern jpype1/openjdk below uses via "cet-download_jdk"
    "pims",
    "nd2reader",
    "tifffile",
    "zarr",
    "pillow",
    "cellpose",
    "psf-generator",
    # GUI
    "pyqt6",
    "pyshortcuts",
    "napari",
    "cachey",  # backs dask's opportunistic Cache, used by cet.gui.viewer.napari_loader
    # java bridge (embeds a JVM via a system JDK - see environments/*.yml;
    # the JDK itself is a system/conda dependency, not pip-installable)
    "jpype1",
    # dataframes / numerics / stats
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "scikit-posthocs",
    "pingouin",
    "cliffs-delta",
    "natsort",
    "umap-learn",
    "POT",
    "networkx",
    # 3D / mesh
    "mahotas",
    "pytree2",
    "pyvista",
    "pymcubes",
    # plotting
    "matplotlib",
    "seaborn",
    "plotly",
    # settings / config
    "pydantic",
    "ruamel.yaml",
    "pyyaml",
    "openpyxl",
    # misc utils
    "psutil",
    "albumentationsx",
    "nvidia-ml-py3",
]

[project.optional-dependencies]
# plain (non-CUDA) torch build from the default PyPI index
cpu = [
    "torch",
    "torchvision",
    "torchinfo",
]
# CUDA-accelerated stack. torch/torchvision here need the CUDA build, which
# PEP 508 dependency specifiers can't select on their own - install with:
#   pip install -e .[gpu] --extra-index-url https://download.pytorch.org/whl/cu130
# (matching environments/environment_gpu.yml's own pip install). cupy additionally
# expects a working CUDA toolkit/driver on the system. pycudadecon isn't listed here
# at all - see the comment next to "pims" above; install it separately via
# "cet-download_pycudadecon".
gpu = [
    "torch",
    "torchvision",
    "torchinfo",
    "cupy-cuda13x",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]

# gui
cet-gui = "cet.gui.app:main"
cet-napari = "cet.gui.viewer.napari_loader:main"
cet-create_shortcut = "cet.gui.create_shortcut:main"

# diagnostics
cet-options = "cet.diagnostics.list_commands:main"
cet-version = "cet.diagnostics.check_version:main"
cet-check_imports = "cet.diagnostics.check_imports:main"
cet-check_gpu = "cet.diagnostics.check_gpu:main"
cet-check_java = "cet.diagnostics.check_java:main"
cet-test_gpu = "cet.gpu.test_gpu:main"

# setup / updating
cet-update = "cet.setup.update:main"
cet-build_update_folder = "cet.setup.build_update_folder:main"
cet-download_cp_models = "cet.setup.download_cp_models:main"
cet-download_jdk = "cet.setup.download_jdk:main"
cet-download_loci_jar = "cet.setup.download_loci_jar:main"
cet-download_pycudadecon = "cet.setup.download_pycudadecon:main"

[tool.setuptools.package-data]
"cet.gui.fonts" = ["*.ttf"]
"cet.gui.icons" = ["*.png"]
"cet.gui.tooltips" = ["*.json"]
"cet.pipelines.settings" = ["*.yaml"]
